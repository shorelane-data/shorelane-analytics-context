# SIMULATION TEST ARTIFACT — human review required.
# Migrated from ACF v0.2 (2026-10-27); not yet re-validated against v0.3 definitions.
# MIGRATION REVIEW (v0.3): ir.metric new_customer_order_share was not carried into v0.3; redefine or retire.
question: What share of d2c orders came from new customers?
domain: marketing
intent: Clarify which orders constitute the numerator; customer count is not interchangeable with order count.
expected:
  kind: sql_shape
  must_include:
  - Real-customer canonical d2c order denominator.
  - Ask whether numerator is first-ever, first-date, or all newly acquired customer orders.
  must_exclude:
  - Invent tie policy or substitute distinct new customers for new-customer orders.
provenance: interview
lineage:
- source: dbt_core
  models:
  - fct_orders
  - dim_customers
ir:
  metric: new_customer_order_share
  time_window: selected_period
review_history:
- status: draft
