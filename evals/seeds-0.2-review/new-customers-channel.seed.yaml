# SIMULATION TEST ARTIFACT — human review required.
# Migrated from ACF v0.2 (2026-10-27); not yet re-validated against v0.3 definitions.
# MIGRATION REVIEW (v0.3): ir.metric new_customers_by_channel was not carried into v0.3; closest is customers.new_customers by channel — confirm or retire.
question: Which channel acquired our new customers last quarter?
domain: customers
intent: Use canonical first-ever order channel across all channels, not profile acquisition_channel. Earliest-date cross-channel ties need human clarification.
ir:
  metric: new_customers_by_channel
  dimensions:
  - channel
  time_window: last_quarter
expected:
  kind: sql_shape
  must_include:
  - First-ever order across all channels; normalize direct to d2c.
  - Clarify unresolved earliest-date cross-channel ties.
  must_exclude:
  - Profile acquisition_channel as a substitute.
  - First purchase within each channel as newly acquired customer.
provenance: interview
lineage:
- source: dbt_core
  models:
  - dim_customers
  - fct_orders
review_history:
- status: draft
