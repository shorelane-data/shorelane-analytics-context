# SIMULATION TEST ARTIFACT — human review required.
question: What was our renewal rate last quarter?
domain: subscriptions
intent: "Renewed terms divided by renewed plus churned terms whose term end falls\
  \ in the period. A subsequent term linked by renewed_from_subscription_id identifies\
  \ renewal. Without renewal, churn occurs at term end. Exclude undecided active terms;\
  \ count terms, anchored on the ending term\u2019s end date."
expected:
  kind: sql_shape
  must_include:
  - Renewed / (renewed + churned) terms ending in the period.
  - Resolve renewal through renewed_from_subscription_id.
  must_exclude:
  - Active undecided terms in denominator.
  - Customer counts or renewal start-date cohort.
provenance: interview
status: draft
lineage:
- source: dbt_core
  models:
  - fct_subscriptions
