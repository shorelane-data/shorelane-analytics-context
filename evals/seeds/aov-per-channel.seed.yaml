# Harvested during Stage 3 entities, 2026-07-29
question: "What's our average order value?"
domain: revenue
intent: >
  AOV = AVG(gross_amount) per order, split by channel — never blended. A
  blended AOV mixes small d2c tickets, large subscription invoices, and
  marketplace full tickets into a meaningless number. Gross is the confirmed
  numerator; a net-based AOV is a different, explicitly-labeled question.
expected:
  kind: sql_shape
  must_include:
    - "AVG(gross_amount) from stg_orders"
    - "GROUP BY channel (no single blended number)"
  must_exclude:
    - "one blended AOV across channels"
    - "net_amount as the unlabeled default numerator"
provenance: interview
status: confirmed
lineage:
  - source: dbt_shorelane
    models: [stg_orders]
