# SIMULATION TEST ARTIFACT — human review required.
# Migrated from ACF v0.2 (2026-10-27); not yet re-validated against v0.3 definitions.
# MIGRATION REVIEW (v0.3): CONFLICT: v0.2 margin covered d2c AND marketplace; v0.3 catalog-margin.gross_margin is D2C only. Rewrite to the new scope or retire.
question: What is Shorelane gross margin by category?
domain: marketing
intent: Category gross margin covers every consumer order line, d2c and marketplace,
  as the Marketing dashboard reports it, with margin % as summed margin over summed
  line_amount per category. Marketplace lines are at retail, so their margin is product
  mix, not Shorelane earnings; the answer says so.
expected:
  kind: sql_shape
  must_include:
  - Include d2c and marketplace consumer order lines.
  - Compute margin % per category as summed margin over summed line_amount.
  must_exclude:
  - Restrict to d2c lines when the question does not ask for d2c.
  - Call marketplace line margin Shorelane earnings.
provenance: interview
status: draft
lineage:
- source: dbt_core
  models:
  - fct_order_lines
  - dim_products
ir:
  metric: gross_margin
  time_window: selected_period
