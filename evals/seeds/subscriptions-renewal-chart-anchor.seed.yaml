# SIMULATION TEST ARTIFACT — human review required before production use.
# Migrated from ACF v0.2 (2026-10-27); not yet re-validated against v0.3 definitions.
question: Why do monthly renewal bars and renewal-rate counts differ?
domain: subscriptions
intent: 'Human-selected rule: monthly Renewals bars count renewal terms by term_start_date;
  renewal rate uses renewed and churned predecessor terms by term_end_date. These
  cohorts may differ at period boundaries.'
expected:
  kind: sql_shape
  must_include:
  - 'Monthly bars: non-first renewal terms selected by term_start_date and bucketed
    by calendar start month.'
  - 'Renewal rate: renewed / (renewed + churned) decided predecessor terms selected
    by term_end_date.'
  - Keep each term counted once within its own cohort; allow different totals at window
    boundaries.
  must_exclude:
  - Use renewal-start bars as numerator of the ending-term renewal rate.
  - Count renewed ending terms as monthly renewal starts.
  - Force cohort totals to agree by changing dates or excluding valid terms.
provenance: interview
status: draft
lineage:
- source: dbt_core
  models:
  - fct_subscriptions
