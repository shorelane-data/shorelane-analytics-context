# SIMULATION TEST ARTIFACT
question: Can order-line sales measure all company revenue?
domain: executive-revenue
intent: Order lines exist only for d2c and marketplace orders, sum to consumer gross
  value, and exclude subscriptions. Marketplace line value is retail, not Shorelane
  take. Use fct_order_lines for consumer product/category mix, quantities and line
  margin. Marketplace retail line margin does not establish Shorelane economic margin;
  marketplace/subscription cost basis is not provided.
