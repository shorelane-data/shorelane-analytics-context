# Harvested during Stage 3 entities, 2026-07-29
question: "What's outstanding in receivables right now?"
domain: revenue
intent: >
  Outstanding = pending invoices only: collected_date IS NULL AND is_bad_debt
  = false. Bad debt is a manual finance write-off (no fixed aging threshold)
  and is excluded — NULL collected_date alone does not mean bad debt, and
  invoice age must never be used to infer write-offs.
expected:
  kind: sql_shape
  must_include:
    - "collected_date IS NULL"
    - "is_bad_debt = false (bad debt excluded)"
  must_exclude:
    - "inferring bad debt from invoice age"
    - "treating all NULL collected_date as bad debt"
provenance: interview
status: confirmed
lineage:
  - source: dbt_shorelane
    models: [stg_invoices]
