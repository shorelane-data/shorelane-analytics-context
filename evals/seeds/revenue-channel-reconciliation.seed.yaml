# SIMULATION TEST ARTIFACT
question: Break recognized revenue down by channel.
domain: executive-revenue
intent: The executive channel chart omits test/internal exclusion and must not be
  used as a reconciliation target. fct_revenue supports date grouping and measure
  selection only. Use fct_orders for order-date GMV/earnings splits. For recognized,
  billed or collected splits, join the corresponding event rows to eligible fct_orders
  on order_id, use measure-specific activity dates, and attribute refunds to original
  orders. Reconcile every split to its fct_revenue total.
