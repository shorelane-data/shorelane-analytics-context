question: How many new customers did we acquire last quarter?
domain: customers
intent: "A new customer\u2019s first-ever order across all channels falls in the period.\
  \ Count distinct real canonical customers, not newly created profiles or a first\
  \ purchase in an additional channel. Attribute new customers by channel to the canonical\
