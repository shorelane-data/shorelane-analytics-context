# Harvested during Stage 1 terminology, 2026-07-28
question: "How much cash did we collect last month?"
domain: revenue
intent: >
  collected_cash counts dollars on the date they actually arrived
  (collection date), never the invoice or order date. Pending net-30 invoices
  and bad-debt invoices contribute nothing. Rejected reading: backdating
  collected dollars to the invoice date.
ir:
  metric: collected_cash
  time_window: last_month
expected:
  kind: sql_shape
  must_include:
    - "dollars dated by collection date (collected_date), not invoice/order date"
  must_exclude:
    - "counting pending (uncollected) invoices as cash"
    - "counting bad-debt invoices"
provenance: interview
status: confirmed
lineage:
  - source: dbt_shorelane
    models: [fct_revenue]
