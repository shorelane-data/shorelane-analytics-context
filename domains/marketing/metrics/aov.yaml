# Human-decided 2026-10-27 (marketing-001): AOV is consumer-only by default.
name: aov
status: draft
definition: >
  Average order value on consumer orders: consumer GMV ÷ consumer orders (d2c + marketplace).
  An all-channel AOV (including subscription orders) is a different figure and must be labelled.
aliases: [average order value]
grain: order (fct_orders)
temporal_kind: rate
parameters: [{shared: period}]
caveats:
- Promotions lower AOV while raising volume and GMV — don't read AOV as promo success.
expression:
  measure: metric(consumer_gmv) / metric(consumer_orders)
  ratio:
    zero_denominator: null
    reason: No consumer orders in the period means AOV is undefined.
  allowed_dimensions: [order_date, channel, segment]
lineage: inherit
