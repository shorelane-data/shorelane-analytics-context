# status: draft — simulated (catalog-001); not human-confirmed.
name: line_revenue
status: draft
definition: >
  Consumer line revenue — SUM(line_amount) over consumer order lines (d2c + marketplace), net of
  the line discount, gross of refunds. Consumer GMV at line grain, not total revenue (subscriptions
  have no lines); marketplace lines are the seller's retail price, not Shorelane's earnings.
aliases: [category revenue, consumer line revenue]
grain: order line (fct_order_lines)
temporal_kind: flow
parameters: [{shared: period}]
expression:
  measure: SUM(line_amount)
  allowed_dimensions: [order_date, category, sku, channel]
lineage: {shared: fct_order_lines}
