# Human-decided 2026-10-27 (catalog-001): ratio of totals, d2c lines only.
name: gross_margin_pct
status: draft
definition: >
  Gross margin % = SUM(gross_margin) ÷ SUM(line_amount) over d2c lines — a ratio of totals, never
  an average of per-line margin percentages.
aliases: [margin, gross margin percent]
grain: order line (fct_order_lines)
temporal_kind: rate
parameters: [{shared: period}]
expression:
  measure: metric(gross_margin) / metric(d2c_line_revenue)
  ratio:
    zero_denominator: null
    reason: No d2c line revenue means margin % is undefined.
  allowed_dimensions: [order_date, category, sku]
lineage: inherit
