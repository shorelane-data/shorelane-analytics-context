  caveats:
  - Exclude active undecided terms.
  - Renewal successor start need not fall in report period.
  - Use loaded-snapshot outcomes; historical knowledge-as-of reconstruction not established.
  - Zero-denominator convention pending human decision.
- name: renewal_rate
  status: draft
  definition: Renewed terms divided by renewed plus churned terms ending in selected
    period.
  grain: Decided subscription term ending in period
  lineage:
  - source: dbt_core
    models:
    - fct_subscriptions
  parameters:
  - name: period_start
    note: Inclusive ending-term end date.
  - name: period_end_exclusive
    note: Exclusive ending-term end date.
  caveats:
  - Exclude active undecided terms.
  - Renewal successor start need not fall in report period.
  - Use loaded-snapshot outcomes; historical knowledge-as-of reconstruction not established.
  - Zero-denominator convention pending human decision.
  - Monthly Renewals bars count renewal_starts by term_start_date; this metric uses
    predecessor term_end_date. Boundary differences are expected.
- name: churn_rate
  status: draft
  definition: Churned terms divided by renewed plus churned terms ending in selected
    period; complement of renewal rate.
  grain: Decided subscription term ending in period
  lineage:
  - source: dbt_core
    models:
    - fct_subscriptions
  parameters:
  - name: period_start
    note: Inclusive ending-term end date.
  - name: period_end_exclusive
    note: Exclusive ending-term end date.
  caveats:
  - Exclude active undecided terms.
  - Renewal successor start need not fall in report period.
  - Use loaded-snapshot outcomes; historical knowledge-as-of reconstruction not established.
  - Zero-denominator convention pending human decision.
- name: grandfathered_share
  status: draft
  definition: Distinct active real customers on plans retired on or before as_of_date
    divided by all distinct active real customers at that date.
  grain: Canonical active customer at date
  lineage:
  - source: dbt_core
    models:
    - fct_subscriptions
    - dim_plans
  parameters:
  - name: as_of_date
    note: Inclusive term containment and retired_date <= as_of_date.
  caveats:
  - Do not hard-code plan_generation != 3 across historical or future dates.
  - Period start does not affect a stock measure.
  - Zero denominator convention pending.
