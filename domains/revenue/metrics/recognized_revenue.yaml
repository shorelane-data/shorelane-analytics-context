# status: draft — simulated-analyst answers (company-002, revenue-001); not human-confirmed.
# dbt-derived (model.fct_revenue accepted_values: measure_name)
name: recognized_revenue
definition: >
  Recognized revenue (GAAP, ratable) — Finance/CFO's official number and the default meaning of unqualified "revenue". Subscriptions are recognized monthly over the 12-month term starting on the order date; d2c and marketplace orders are recognized in full on the order date. Can exceed GMV in a period because of ratable recognition.
aliases: ['revenue']
alias_notes: ["Unqualified revenue resolves here, but state the assumption — other teams mean other measures."]
grain: one fct_revenue row = one underlying money movement (identifiers dropped); sum amount over an explicit activity_date range
temporal_kind: flow
parameters:
- name: time_window
  note: Required. Attributed by activity_date, which for this measure is the recognition date. Use explicit bounds; "last quarter" = most recent completed calendar quarter.
caveats:
- fct_revenue has no channel, customer or product columns — splits route through fct_orders (see reference.md).
- Refunds are already negative rows; never subtract refunds again.
- The five revenue measures are not additive; never sum across measure_name values.
- "Never source revenue from staging views (stg_*) — they include test and internal accounts."
expression:
  measure: SUM(amount)
  mandatory_filters:
  - field: measure_name
    op: '='
    value: recognized_revenue
    reason: fct_revenue stacks five non-additive measures; without this the sum mixes them.
  allowed_dimensions: [activity_date]
family:
  name: revenue_measures
  discriminator: measure_name
  siblings: ['gmv', 'net_revenue', 'billed_revenue', 'collected_cash']
lineage: {shared: fct_revenue}
