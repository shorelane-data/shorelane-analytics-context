# domain.yaml — structured metadata for one domain.
name: revenue
summary: >
  How much Shorelane sold, earned, billed, collected, and recognized — the five
  revenue measures over time. Answers "what was <revenue measure> in <period>?"
  and "why do two revenue numbers disagree?"
status: confirmed
owner: Ron Potok
grain: >
  One row per revenue event in fct_revenue: (activity_date, measure_name,
  amount). activity_date × measure_name is NOT unique — a day×measure has many
  rows, so correct queries always SUM(amount).
tables:
  canonical: nodal-shorelane.shorelane.fct_revenue
  others:
    - nodal-shorelane.shorelane.stg_orders
    - nodal-shorelane.shorelane.stg_invoices
    - nodal-shorelane.shorelane.stg_refunds
    - nodal-shorelane.shorelane.stg_revenue_recognition
dashboards:
  - name: business (scheduled Plotly dashboard)
    owner: Ron Potok
    canonical_question: >
      The executive view, switchable Last 6/12/24 Months or All Time: six KPIs
      (recognized revenue, GMV, active/new customers, AOV, refund rate) and five
      charts (recognized revenue by month, revenue by channel, customer growth,
      orders & AOV, recognized revenue vs collected cash). All windows end at the
      last fully-elapsed month. Redesigned 2026-08: billed_revenue no longer
      shown here — read it off the five-revenues dashboard below.
      (https://shorelane-data.github.io/shorelane/business/)
  - name: Five revenues — public demo dashboard
    owner: Ron Potok
    canonical_question: >
      What are the five revenue measures and how do they differ over time?
      (https://shorelane-data.github.io/shorelane/dashboard/)
lineage:
  - source: dbt_shorelane
    models:
      - fct_revenue
      - stg_orders
      - stg_invoices
      - stg_refunds
      - stg_revenue_recognition
