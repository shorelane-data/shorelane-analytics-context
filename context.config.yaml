# context.config.yaml — repo metadata + the domain↔lineage map that makes
# "context lives apart from lineage" safe. Every domain MUST carry a lineage
# pointer so drift detection can fire when an upstream model changes.
version: 0.1
warehouse: bigquery             # default platform; a per-source `warehouse:` overrides it
                                # (snowflake | bigquery | databricks | postgres | ...)

lineage_sources:
  # Primary/live source — the standalone dbt repo running daily builds against BigQuery.
  # Its notify-context-repo.yml workflow publishes manifest.json on the orphan
  # `dbt-manifest` branch and dispatches lineage-changed here.
  - id: dbt_shorelane_dbt
    type: dbt
    repo: github.com/nodal-data/shorelane-dbt
    ref: dbt-manifest
    manifest_path: manifest.json
  # Second source — the shorelane monorepo (dbt nested under dbt/). Same convention:
  # its sender copies dbt/target/manifest.json to the here
  # is identical regardless of the nesting.
  - id: dbt_shorelane
    type: dbt
    repo: github.com/nodal-data/shorelane
    ref: dbt-manifest
    manifest_path: manifest.json

domains:
  revenue:
    lineage:
      - source: dbt_shorelane_dbt
        models:
          - fct_revenue
          - stg_orders
          - stg_invoices
          - stg_refunds
          - stg_revenue_recognition
      - source: dbt_shorelane
        models:
          - fct_revenue
          - stg_orders
          - stg_invoices
          - stg_refunds
          - stg_revenue_recognition
